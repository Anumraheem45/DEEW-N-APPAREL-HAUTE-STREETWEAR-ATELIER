<!DOCTYPE html>
<html>
<head>
  <title>Image Catalog Inspector</title>
  <style>
    body { font-family: sans-serif; background: #121212; color: #fff; padding: 20px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
    .card { background: #1e1e1e; border-radius: 8px; overflow: hidden; padding: 8px; text-align: center; }
    img { width: 100%; height: 260px; object-fit: cover; border-radius: 4px; }
    p { margin: 8px 0 0; font-size: 13px; color: #aaa; }
  </style>
</head>
<body>
  <h1>Alfaaz & Noir - Image Catalog</h1>
  <div class="grid" id="grid"></div>
  <script>
    const images = [
      '1img shart.jpg', '2img shart.jpg', '3img.jpg', '4img.jpg', '5img.jpg',
      '6img.jpg', '7img.jpg', '8img.jpg', '9img.jpg', '10img.jpg',
      '11img.jpg', '12img.jpg', '13img.jpg', '14img.jpg', '15img.jpg',
      '16img.jpg', '17img.jpg', '18img.jpg', '19img.jpg', '20img.jpg',
      '21img.jpg', '22img.jpg', '23img.jpg', '24img.jpg', '25img.jpg',
      '26img.jpg', '27img.jpg', '28img.jpg', '29img.jpg', '30img.jpg',
      '31img.jpg', '32img.jpg', '33img.jpg', '34img.jpg', '35img.jpg',
      '36img.jpg', '37img.jpg', '38img.jpg', '39img.jpg', '40img.jpg',
      '41img.jpg', '42img.jpg', '43img.jpg', '44img.jpg', '45img.jpg'
    ];
    const grid = document.getElementById('grid');
    images.forEach(img => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `<img src="${img}" alt="${img}"><p>${img}</p>`;
      grid.appendChild(card);
    });
  </script>
</body>
</html>
